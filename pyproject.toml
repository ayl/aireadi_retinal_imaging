[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophthalmic-dicom-compliance"
version = "0.1.0"
description = "Ophthalmic DICOM compliance report generator."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.3",
    "pillow>=11.0",
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.3",
    "pylibjpeg-openjpeg>=2.5",
    "tqdm>=4.67",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
]

[project.scripts]
ophthalmic-dicom-report = "ophthalmic_dicom_compliance.cli.compliance_report:main"
aireadi-compliance-report = "ophthalmic_dicom_compliance.console:main"

[tool.setuptools]
packages = [
    "ophthalmic_dicom_compliance",
    "ophthalmic_dicom_compliance.cli",
    "ophthalmic_dicom_compliance.compliance",
    "ophthalmic_dicom_compliance.devices",
    "ophthalmic_dicom_compliance.devices.cirrus",
    "ophthalmic_dicom_compliance.devices.eidon",
    "ophthalmic_dicom_compliance.devices.flio",
    "ophthalmic_dicom_compliance.devices.optomed",
    "ophthalmic_dicom_compliance.devices.spectralis",
    "ophthalmic_dicom_compliance.devices.topcon",
    "ophthalmic_dicom_compliance.dicom",
    "ophthalmic_dicom_compliance.main",
]
include-package-data = true

[tool.setuptools.package-dir]
ophthalmic_dicom_compliance = "."
"ophthalmic_dicom_compliance.cli" = "cli"
"ophthalmic_dicom_compliance.compliance" = "compliance"
"ophthalmic_dicom_compliance.devices" = "devices"
"ophthalmic_dicom_compliance.devices.cirrus" = "devices/cirrus"
"ophthalmic_dicom_compliance.devices.eidon" = "devices/eidon"
"ophthalmic_dicom_compliance.devices.flio" = "devices/flio"
"ophthalmic_dicom_compliance.devices.optomed" = "devices/optomed"
"ophthalmic_dicom_compliance.devices.spectralis" = "devices/spectralis"
"ophthalmic_dicom_compliance.devices.topcon" = "devices/topcon"
"ophthalmic_dicom_compliance.dicom" = "dicom"
"ophthalmic_dicom_compliance.main" = "main"

[tool.setuptools.package-data]
"ophthalmic_dicom_compliance.devices.flio" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = [
    "--cov=ophthalmic_dicom_compliance.cli",
    "--cov=ophthalmic_dicom_compliance.compliance",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
